[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "priceaction-terminal"
version = "0.1.0"
description = "OKX liquidity hunter desktop trading terminal"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "PySide6-WebEngine>=6.7,<7",
  "python-okx==0.4.4",
  "aiohttp>=3.10,<4",
  "websockets>=13,<16",
  "pydantic>=2.7,<3",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "loguru>=0.7,<1",
  "PyYAML>=6,<7",
]
